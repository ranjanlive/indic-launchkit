[workspace]
members = ["crates/launchkit-core", "crates/launchkit-cli", "src-tauri"]
default-members = ["crates/launchkit-core", "crates/launchkit-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

